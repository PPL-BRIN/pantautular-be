coverage:
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%

comment:                   
  layout: " diff, flags, files"
  behavior: default
  require_changes: false  
  require_base: true
  require_head: true       
  hide_project_coverage: false
  show_missing: true

ignore:
  - "migrations/"
  - "**/__init__.py"
