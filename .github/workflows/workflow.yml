coverage:
  status:
    project:
      default:
        threshold: 100%
    patch:
      default:
        threshold: 0% 

comment:                  
  layout: " diff, flags, files"
  behavior: default
  require_changes: false  
  require_base: false        
  require_head: true       
  hide_project_coverage: false

ignore:
  - "migrations/"
  - "**/__init__.py"